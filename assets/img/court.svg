<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="Схема корта для падела 20 на 10 метров с разметкой">
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- Стеклянные стены по периметру -->
  <rect x="70" y="100" width="860" height="430" fill="#eff6ff" stroke="#0284c7" stroke-width="12" stroke-opacity="0.45" rx="4"/>

  <!-- Игровая площадка -->
  <rect x="70" y="100" width="860" height="430" fill="none" stroke="#0f172a" stroke-width="5"/>

  <!-- Сетка -->
  <line x1="500" y1="100" x2="500" y2="530" stroke="#ca8a04" stroke-width="8" stroke-dasharray="12 9"/>
  <circle cx="500" cy="100" r="6" fill="#0f172a"/>
  <circle cx="500" cy="530" r="6" fill="#0f172a"/>

  <!-- Линии подачи (3 м от задних стен) и центральная линия -->
  <line x1="199" y1="100" x2="199" y2="530" stroke="#0f172a" stroke-width="4"/>
  <line x1="801" y1="100" x2="801" y2="530" stroke="#0f172a" stroke-width="4"/>
  <line x1="199" y1="315" x2="801" y2="315" stroke="#0f172a" stroke-width="4"/>

  <!-- Подписи зон -->
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#64748b">
    <text x="430" y="300" text-anchor="middle">подача</text>
    <text x="570" y="300" text-anchor="middle">подача</text>
    <text x="430" y="360" text-anchor="middle">подача</text>
    <text x="570" y="360" text-anchor="middle">подача</text>
    <text x="500" y="82" text-anchor="middle" fill="#a16207">СЕТКА</text>
  </g>

  <!-- Мяч -->
  <circle cx="300" cy="240" r="12" fill="#facc15" stroke="#a16207" stroke-width="3"/>
  <path d="M312 240h50" stroke="#ca8a04" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Размер 20 м -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M70 585h860"/>
    <path d="M70 574v22M930 574v22"/>
    <path d="M70 560l-8 14 8 14M930 560l8 14-8 14"/>
  </g>
  <text x="500" y="625" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#475569">20 метров</text>

  <!-- Размер 10 м -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M936 100v430"/>
    <path d="M925 100h22M925 530h22"/>
  </g>
  <text x="958" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#475569" transform="rotate(90 958 322)">10 метров</text>

  <!-- Размер 3 м -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M70 68h129"/>
    <path d="M70 58v20M199 58v20"/>
  </g>
  <text x="134" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#475569">3 м</text>

  <!-- Легенда -->
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">
    <line x1="120" y1="645" x2="160" y2="645" stroke="#ca8a04" stroke-width="8" stroke-dasharray="10 7"/>
    <text x="170" y="650">сетка</text>
    <line x1="270" y1="645" x2="310" y2="645" stroke="#0284c7" stroke-width="8" stroke-opacity="0.45"/>
    <text x="320" y="650">стекло и металлическая сетка</text>
    <line x1="620" y1="645" x2="660" y2="645" stroke="#0f172a" stroke-width="4"/>
    <text x="670" y="650">линии разметки</text>
  </g>
</svg>
